<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script2Video</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
}
.container { max-width: 700px; width: 100%; padding: 2rem; }
h1 { text-align: center; margin-bottom: 0.5rem; font-size: 2rem; }
p.sub { text-align: center; color: #aaa; margin-bottom: 2rem; }
textarea {
    width: 100%; min-height: 160px; padding: 1rem;
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    font-size: 1rem; resize: vertical;
}
textarea:focus { outline: none; border-color: #7c5cff; }
select {
    width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.08);
    color: #fff; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px; font-size: 1rem; margin-top: 1rem;
}
button {
    width: 100%; padding: 1rem; margin-top: 1.5rem;
    background: linear-gradient(90deg, #7c5cff, #00b8d4);
    color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
#log {
    margin-top: 1.5rem; padding: 1rem;
    background: rgba(0,0,0,0.3); border-radius: 12px;
    font-family: monospace; font-size: 0.85rem;
    color: #b8ffb8; min-height: 2rem; white-space: pre-wrap;
}
#results { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.video-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 1rem; }
.video-card h3 { margin-bottom: 0.5rem; }
video { width: 100%; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
    <h1>🎬 Script2Video</h1>
    <p class="sub">Paste your script — get a video with voiceover & word-by-word captions</p>

    <textarea id="script" placeholder="Yahan apni script paste karein..."></textarea>
    <select id="voice">
        <option value="male_en">English Male (Christopher)</option>
        <option value="female_en">English Female (Jenny)</option>
        <option value="male_ur">Urdu Male (Asad)</option>
        <option value="female_ur">Urdu Female (Uzma)</option>
    </select>
    <button id="go" onclick="generate()">🚀 Generate Video</button>

    <div id="log"></div>
    <div id="results"></div>
</div>
<script>
    const BASE = window.location.pathname.replace(/\/$/, "");
let pollTimer = null;
function generate() {
    const script = document.getElementById('script').value.trim();
    if (!script) { alert('Script likhein pehle!'); return; }
    const voice = document.getElementById('voice').value;
    document.getElementById('go').disabled = true;
    document.getElementById('log').textContent = 'Submitting...';
    document.getElementById('results').innerHTML = '';

    fetch(BASE+'/api/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({script, voice})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) throw new Error(data.error);
        pollTimer = setInterval(() => poll(data.job_id), 2000);
    })
    .catch(e => {
        document.getElementById('log').textContent = 'Error: ' + e.message;
        document.getElementById('go').disabled = false;
    });
}
function poll(jobId) {
    fetch(BASE+'/api/status/' + jobId)
    .then(r => r.json())
    .then(job => {
        document.getElementById('log').textContent = job.log.join('\n');
        if (job.status === 'done') {
            clearInterval(pollTimer);
            document.getElementById('go').disabled = false;
            const results = document.getElementById('results');
            for (const [label, path] of Object.entries(job.result)) {
                if (label === 'editor') {
                    results.innerHTML += `
                        <div class="video-card">
                            <h3>🛠️ Open in Editor</h3>
                            <a href="${path}">Edit timeline →</a>
                        </div>`;
                    continue;
                }
                results.innerHTML += `
                    <div class="video-card">
                        <h3>${label === '16x9' ? 'YouTube (16:9)' : 'TikTok/Reels (9:16)'}</h3>
                        <video controls src="${path}"></video>
                        <a href="${path}" download>Download</a>
                    </div>`;
            }
        } else if (job.status === 'error') {
            clearInterval(pollTimer);
            document.getElementById('go').disabled = false;
            document.getElementById('log').textContent += '\n❌ ' + job.log.join('\n');
        }
    });
}
</script>
</body>
</html>
